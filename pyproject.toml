[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coospo-cli"
version = "0.1.0"
description = "Command-line tool for COOSPO CS500/CS600 bike computers: device info, battery, memory usage and FIT file download over Bluetooth LE"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["bleak>=0.22"]
keywords = ["coospo", "cs500", "cs600", "bike computer", "cycling", "fit", "bluetooth", "ble"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/blshkv/coospo-cli"
Protocol = "https://github.com/blshkv/coospo-cli/blob/main/PROTOCOL.md"
Issues = "https://github.com/blshkv/coospo-cli/issues"

[project.scripts]
coospo = "coospo.cli:run"
